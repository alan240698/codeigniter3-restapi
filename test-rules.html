<!DOCTYPE html>
<html>
<head>
    <title>Rules API Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>🔍 Rules API Diagnostic Test</h1>
    
    <div id="results"></div>
    
    <script>
        const baseUrl = 'http://codeigniter3-restapi.test/';
        const results = document.getElementById('results');
        
        async function testAPI(name, endpoint) {
            const div = document.createElement('div');
            div.className = 'test';
            div.innerHTML = `<h3>Testing: ${name}</h3><p>Loading...</p>`;
            results.appendChild(div);
            
            try {
                const response = await fetch(baseUrl + endpoint);
                const data = await response.json();
                
                div.className = 'test ' + (data.success ? 'success' : 'error');
                div.innerHTML = `
                    <h3>✅ ${name}</h3>
                    <p><strong>Status:</strong> ${response.status} ${response.statusText}</p>
                    <p><strong>Success:</strong> ${data.success}</p>
                    <p><strong>Data Count:</strong> ${data.data ? data.data.length : 0} records</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                div.className = 'test error';
                div.innerHTML = `
                    <h3>❌ ${name}</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }
        
        // Test all APIs
        testAPI('Routing Rules', 'routing-rules');
        testAPI('Approval Rules', 'approval-rules');
        testAPI('Level Rules', 'level-rules');
        testAPI('Custom Fields', 'custom-fields');
        testAPI('Issue Types', 'issue-types/all-group-type');
        testAPI('Support Teams', 'support-teams');
    </script>
</body>
</html>
