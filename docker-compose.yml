version: '3.8'

services:
    web:
        build: .
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html
        depends_on:
            - db
        environment:
            - DB_HOST=db
            - DB_NAME=codeigniter_db
            - DB_USER=ci_user
            - DB_PASS=ci_password
        networks:
            - app-network

    db:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: root_password
            MYSQL_DATABASE: codeigniter_db
            MYSQL_USER: ci_user
            MYSQL_PASSWORD: ci_password
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - app-network

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
        ports:
            - "8081:80"
        depends_on:
            - db
        networks:
            - app-network

volumes:
    db_data:

networks:
    app-network:
        driver: bridge
