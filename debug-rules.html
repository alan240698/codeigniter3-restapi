<!DOCTYPE html>
<html>

<head>
    <title>Debug Rules Tab</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        .test {
            margin: 15px 0;
            padding: 15px;
            border: 1px solid #ddd;
        }

        .success {
            background: #d4edda;
        }

        .error {
            background: #f8d7da;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        pre {
            background: #f5f5f5;
            padding: 10px;
            overflow: auto;
            max-height: 300px;
        }
    </style>
</head>

<body>
    <h1>🔍 Debug Rules Tab - JavaScript Test</h1>

    <button onclick="testApprovalRulesAPI()">Test Approval Rules API</button>
    <button onclick="testLevelRulesAPI()">Test Level Rules API</button>
    <button onclick="testCustomFieldsAPI()">Test Custom Fields API</button>
    <button onclick="testIssueTypesAPI()">Test Issue Types API</button>
    <button onclick="testSupportTeamsAPI()">Test Support Teams API</button>

    <div id="results"></div>

    <script>
        const baseUrl = 'http://codeigniter3-restapi.test/';

        async function testAPI(name, endpoint) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'test';
            div.innerHTML = `<h3>Testing: ${name}</h3><p>Loading...</p>`;
            results.appendChild(div);

            try {
                console.log(`Fetching: ${baseUrl}${endpoint}`);
                const response = await fetch(baseUrl + endpoint);
                const data = await response.json();

                console.log(`${name} Response:`, data);

                div.className = 'test ' + (data.success ? 'success' : 'error');
                div.innerHTML = `
                    <h3>✅ ${name}</h3>
                    <p><strong>URL:</strong> ${baseUrl}${endpoint}</p>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Success:</strong> ${data.success}</p>
                    <p><strong>Records:</strong> ${data.data ? data.data.length : 0}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                console.error(`${name} Error:`, error);
                div.className = 'test error';
                div.innerHTML = `
                    <h3>❌ ${name}</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <pre>${error.stack}</pre>
                `;
            }
        }

        function testApprovalRulesAPI() {
            document.getElementById('results').innerHTML = '';
            testAPI('Approval Rules', 'approval-rules');
        }

        function testLevelRulesAPI() {
            document.getElementById('results').innerHTML = '';
            testAPI('Level Rules', 'level-rules');
        }

        function testCustomFieldsAPI() {
            document.getElementById('results').innerHTML = '';
            testAPI('Custom Fields', 'custom-fields');
        }

        function testIssueTypesAPI() {
            document.getElementById('results').innerHTML = '';
            testAPI('Issue Types', 'issue-types/all-group-type');
        }

        function testSupportTeamsAPI() {
            document.getElementById('results').innerHTML = '';
            testAPI('Support Teams', 'support-teams');
        }

        // Auto test on load
        window.onload = () => {
            console.log('=== Auto Testing All APIs ===');
            setTimeout(() => testApprovalRulesAPI(), 500);
            setTimeout(() => testLevelRulesAPI(), 1500);
            setTimeout(() => testCustomFieldsAPI(), 2500);
        };
    </script>
</body>

</html>
